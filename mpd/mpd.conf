music_directory    "~/Music"
playlist_directory "~/Music/Playlists"
db_file            "~/.config/mpd/database"
state_file         "~/.local/state/mpd/state"

auto_update        "yes"
restore_paused     "yes"
bind_to_address    "localhost"

audio_output {
    type "pipewire"
    name "PipeWire output"
}
